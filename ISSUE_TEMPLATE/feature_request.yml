name: Feature request
description: Suggest something new for the SDK or MCP server.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or use case, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: The API, tool or behaviour you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried?
      description: Workarounds or alternatives you've considered.
